[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricing-methods"
version = "0.1.0"
description = "European, American and Asian option pricing with closed form, binomial, finite-difference and Monte Carlo methods"
authors = [{ name = "Jean-Baptiste Dumont" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pricing"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
